name: curate-hormozi
on:
  push:
    paths: [curate.py, .github/workflows/curate.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -U yt-dlp
      - run: python curate.py
      - name: Commit results
        run: |
          git config user.name "curate-bot"
          git config user.email "bot@users.noreply.github.com"
          git add videos.csv videos.json
          git commit -m "Update curated video list" || echo "no changes"
          git push
